<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Afazeres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink:     #141218;
      --ink-2:   #3d3847;
      --muted:   #8b8599;
      --line:    rgba(90, 84, 108, 0.13);
      --bg:      #f5f3ef;
      --surface: #faf9f7;
      --card:    #ffffff;
      --accent:  #2d6a4f;
      --accent-2:#52b788;
      --accent-soft: rgba(45, 106, 79, 0.09);
      --danger:  #c1440e;
      --done-bg: #f0f4f1;
      --r:       20px;
      --r-sm:    14px;
      --shadow:  0 2px 12px rgba(20, 18, 24, 0.06), 0 1px 3px rgba(20,18,24,0.04);
      --shadow-card: 0 4px 24px rgba(20, 18, 24, 0.08), 0 1px 4px rgba(20,18,24,0.04);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      color: var(--ink);
      background: var(--bg);
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      padding-bottom: 40px;
    }

    /* ─── Top bar ─── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(245, 243, 239, 0.88);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border-bottom: 1px solid var(--line);
      padding: 0 20px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topbar-logo {
      width: 30px;
      height: 30px;
      background: var(--accent);
      border-radius: 9px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .topbar-logo svg { width: 17px; height: 17px; color: #fff; }

    .topbar-title {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 19px;
      letter-spacing: -0.02em;
      flex: 1;
    }

    .topbar-count {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      background: var(--accent-soft);
      border-radius: 999px;
      padding: 3px 10px;
      display: none;
    }

    .topbar-count.visible { display: block; }

    /* ─── Layout ─── */
    .app {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 24px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* ─── Hero ─── */
    .hero {
      padding: 28px 24px 24px;
      background: var(--card);
      border-radius: var(--r);
      box-shadow: var(--shadow-card);
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(82,183,136,0.18), transparent 70%);
      pointer-events: none;
    }

    .hero-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-2);
      margin-bottom: 8px;
    }

    .hero h1 {
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(32px, 7vw, 44px);
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--ink);
    }

    .hero h1 em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-sub {
      margin-top: 10px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 420px;
    }

    /* ─── Progress bar ─── */
    .progress-wrap {
      margin-top: 18px;
      display: none;
    }

    .progress-wrap.visible { display: block; }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .progress-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .progress-pct {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    .progress-track {
      height: 6px;
      border-radius: 999px;
      background: var(--accent-soft);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ─── Input card ─── */
    .card {
      background: var(--card);
      border-radius: var(--r);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-card);
    }

    .card-section {
      padding: 18px 20px;
    }

    .card-section + .card-section {
      border-top: 1px solid var(--line);
    }

    .field-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .field-label svg { width: 13px; height: 13px; flex-shrink: 0; }

    textarea {
      width: 100%;
      resize: vertical;
      min-height: 140px;
      padding: 13px 15px;
      font: 15px/1.55 'DM Sans', sans-serif;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    textarea::placeholder { color: var(--muted); }

    textarea:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.14);
    }

    /* ─── File drop zone ─── */
    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 22px 16px;
      border: 1.5px dashed rgba(82,183,136,0.35);
      border-radius: var(--r-sm);
      background: var(--accent-soft);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      text-align: center;
      position: relative;
    }

    .dropzone:hover, .dropzone.drag {
      border-color: var(--accent-2);
      background: rgba(82, 183, 136, 0.13);
    }

    .dropzone input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .dropzone-icon {
      width: 36px; height: 36px;
      background: var(--card);
      border-radius: 10px;
      display: grid;
      place-items: center;
      box-shadow: var(--shadow);
    }

    .dropzone-icon svg { width: 18px; height: 18px; color: var(--accent); }

    .dropzone-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-2);
    }

    .dropzone-hint {
      font-size: 11.5px;
      color: var(--muted);
    }

    /* ─── Error ─── */
    .error {
      display: none;
      margin: 0 20px 16px;
      padding: 11px 14px;
      background: rgba(255, 240, 235, 0.95);
      border: 1px solid rgba(193, 68, 14, 0.22);
      border-radius: var(--r-sm);
      color: var(--danger);
      font-size: 13.5px;
      line-height: 1.4;
    }

    .error.show { display: block; }

    /* ─── Task list ─── */
    .tasks-card {
      background: var(--card);
      border-radius: var(--r);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .tasks-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--line);
    }

    .tasks-header-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      flex: 1;
      color: var(--ink-2);
    }

    .btn-clear {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 999px;
      transition: background 0.15s, color 0.15s;
      display: none;
    }

    .btn-clear:hover { background: rgba(193,68,14,0.08); color: var(--danger); }
    .btn-clear.visible { display: block; }

    .task-list {
      list-style: none;
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--r-sm);
      background: var(--surface);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.17s, border-color 0.17s, opacity 0.17s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .task-item:active {
      transform: scale(0.985);
    }

    .task-item.done {
      background: var(--done-bg);
      opacity: 0.72;
    }

    .task-item:not(.done):hover {
      background: #fff;
      border-color: rgba(82, 183, 136, 0.2);
    }

    /* Custom checkbox */
    .cb {
      width: 22px; height: 22px;
      border-radius: 7px;
      border: 2px solid var(--line);
      background: var(--card);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }

    .task-item.done .cb {
      background: var(--accent);
      border-color: var(--accent);
    }

    .cb-check {
      display: none;
      width: 12px; height: 12px;
    }

    .task-item.done .cb-check { display: block; }

    .task-item:not(.done):hover .cb {
      border-color: var(--accent-2);
    }

    .task-text {
      font-size: 15px;
      line-height: 1.4;
      color: var(--ink);
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-delete {
      opacity: 0;
      padding: 4px;
      border-radius: 8px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      display: grid;
      place-items: center;
      transition: opacity 0.15s, background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .task-item:hover .task-delete,
    .task-item:focus-within .task-delete {
      opacity: 1;
    }

    /* always visible on touch */
    @media (hover: none) {
      .task-delete { opacity: 0.45; }
    }

    .task-delete:hover { background: rgba(193,68,14,0.1); color: var(--danger); }
    .task-delete svg { width: 15px; height: 15px; }

    /* ─── Empty ─── */
    .empty {
      padding: 40px 20px;
      text-align: center;
    }

    .empty-icon {
      width: 52px; height: 52px;
      background: var(--accent-soft);
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
    }

    .empty-icon svg { width: 26px; height: 26px; color: var(--accent-2); }

    .empty-title {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.5;
      max-width: 280px;
      margin: 0 auto;
    }

    /* ─── Quick add ─── */
    .quick-add {
      display: flex;
      gap: 8px;
      padding: 12px 12px 12px;
      border-top: 1px solid var(--line);
    }

    .quick-input {
      flex: 1;
      padding: 10px 14px;
      font: 14px/1 'DM Sans', sans-serif;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: var(--r-sm);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .quick-input:focus {
      border-color: var(--accent-2);
      box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.12);
    }

    .quick-input::placeholder { color: var(--muted); font-size: 13.5px; }

    .btn-add {
      padding: 10px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r-sm);
      font: 600 14px/1 'DM Sans', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .btn-add:hover { background: #245a42; }
    .btn-add:active { transform: scale(0.96); }
    .btn-add svg { width: 15px; height: 15px; }

    /* ─── Animations ─── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item { animation: slideIn 0.22s ease both; }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .app { padding: 14px 10px 0; gap: 10px; }
      .hero { padding: 22px 18px 20px; }
      .card-section { padding: 15px 16px; }
      .tasks-header { padding: 13px 16px 11px; }
      .task-list { padding: 8px 8px 10px; }
      .quick-add { padding: 10px 8px 10px; }
      .btn-add span { display: none; }
    }
  </style>
</head>
<body>

  <!-- ─── Top bar ─── -->
  <nav class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
    </div>
    <span class="topbar-title">Afazeres</span>
    <span class="topbar-count" id="topCount"></span>
  </nav>

  <main class="app">

    <!-- ─── Hero ─── -->
    <section class="hero">
      <p class="hero-eyebrow">Lista de tarefas</p>
      <h1>Organiza<em>ção</em><br>começa aqui.</h1>
      <p class="hero-sub">Adicione tarefas manualmente, cole texto com checkbox ou importe um JSON.</p>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-header">
          <span class="progress-label">Progresso do dia</span>
          <span class="progress-pct" id="progressPct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>
    </section>

    <!-- ─── Inputs ─── -->
    <section class="card" aria-label="Adicionar tarefas">
      <div class="card-section">
        <p class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          Colar texto com checkbox
        </p>
        <textarea id="textInput" placeholder="[ ] Beber água&#10;[x] Tomar café&#10;[ ] Estudar 30 minutos"></textarea>
      </div>

      <div class="card-section">
        <p class="field-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/>
          </svg>
          Importar JSON
        </p>
        <div class="dropzone" id="dropzone">
          <input type="file" accept="application/json,.json" id="jsonInput" aria-label="Importar arquivo JSON" />
          <div class="dropzone-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/>
              <path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/>
            </svg>
          </div>
          <p class="dropzone-text">Arraste ou toque para escolher</p>
          <p class="dropzone-hint">Aceita .json com array ou objeto</p>
        </div>
      </div>

      <div id="error" class="error" role="alert"></div>
    </section>

    <!-- ─── Task list ─── -->
    <section class="tasks-card" aria-label="Lista de afazeres">
      <div class="tasks-header">
        <span class="tasks-header-title">Tarefas</span>
        <button class="btn-clear" id="btnClear" aria-label="Limpar tudo">Limpar tudo</button>
      </div>

      <ul class="task-list" id="taskList" aria-live="polite"></ul>

      <div class="quick-add">
        <input class="quick-input" id="quickInput" type="text" placeholder="Nova tarefa..." aria-label="Nova tarefa" autocomplete="off" />
        <button class="btn-add" id="btnAdd" aria-label="Adicionar tarefa">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span>Adicionar</span>
        </button>
      </div>
    </section>

  </main>

  <script>
    const STORAGE_KEY = 'afazeres-v3';

    const textInput   = document.getElementById('textInput');
    const jsonInput   = document.getElementById('jsonInput');
    const dropzone    = document.getElementById('dropzone');
    const taskList    = document.getElementById('taskList');
    const errorBox    = document.getElementById('error');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressPct  = document.getElementById('progressPct');
    const topCount     = document.getElementById('topCount');
    const btnClear     = document.getElementById('btnClear');
    const quickInput   = document.getElementById('quickInput');
    const btnAdd       = document.getElementById('btnAdd');

    let tasks = [];

    /* ─── Error ─── */
    const showError = msg => { errorBox.textContent = msg; errorBox.classList.add('show'); };
    const clearError = () => { errorBox.textContent = ''; errorBox.classList.remove('show'); };

    /* ─── Parse ─── */
    function parseTextLine(line, idx) {
      let text = String(line ?? '').trim();
      let done = false;
      const patterns = [
        /^[-*•]?\s*\[(x|X|✓| )\]\s*(.*)$/,
        /^[-*•]?\s*(☑|✅|✔|✓|☒)\s*(.*)$/,
        /^[-*•]?\s*(☐|□)\s*(.*)$/
      ];
      for (const p of patterns) {
        const m = text.match(p);
        if (m) { done = ![' ','☐','□'].includes(m[1]); text = m[2].trim(); break; }
      }
      text = text.replace(/^[-*•]\s+/, '').trim();
      return { id: crypto.randomUUID(), text: text || `Tarefa ${idx + 1}`, done };
    }

    function parseText(value) {
      return value.split(/\r?\n/)
        .map((l, i) => parseTextLine(l, i))
        .filter(t => t.text.trim().length > 0);
    }

    function normalizeTask(raw, idx) {
      if (typeof raw === 'string') return parseTextLine(raw, idx);
      if (raw && typeof raw === 'object') {
        const text = raw.texto ?? raw.tarefa ?? raw.task ?? raw.title ?? raw.titulo ?? raw.name ?? raw.nome ?? raw.activity ?? raw.atividade ?? '';
        const done = Boolean(raw.feito ?? raw.done ?? raw.completed ?? raw.concluido ?? raw.concluído ?? false);
        return { id: crypto.randomUUID(), text: String(text).trim(), done };
      }
      return { id: crypto.randomUUID(), text: String(raw ?? '').trim(), done: false };
    }

    function extractFromJson(data) {
      if (Array.isArray(data)) return data.map(normalizeTask).filter(t => t.text.length > 0);
      if (data && typeof data === 'object') {
        const list = [data.tarefas, data.tasks, data.items, data.afazeres, data.lista, data.rotina, data.activities, data.atividades].find(Array.isArray);
        if (list) return list.map(normalizeTask).filter(t => t.text.length > 0);
      }
      throw new Error('JSON inválido. Use um array de textos ou objetos com campo de texto.');
    }

    const tasksToText = list => list.map(t => `[${t.done ? 'x' : ' '}] ${t.text}`).join('\n');

    /* ─── Persist ─── */
    const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));

    /* ─── Render ─── */
    function render() {
      const total = tasks.length;
      const done  = tasks.filter(t => t.done).length;

      // progress
      progressWrap.classList.toggle('visible', total > 0);
      if (total > 0) {
        const pct = Math.round((done / total) * 100);
        progressFill.style.width = pct + '%';
        progressPct.textContent  = pct + '%';
      }

      // top count
      const pending = tasks.filter(t => !t.done).length;
      topCount.classList.toggle('visible', total > 0);
      topCount.textContent = pending > 0 ? `${pending} pendente${pending > 1 ? 's' : ''}` : '✓ Tudo feito';

      // clear button
      btnClear.classList.toggle('visible', total > 0);

      // list
      taskList.innerHTML = '';

      if (!total) {
        taskList.innerHTML = `
          <li class="empty">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                <line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/>
                <line x1="16" y1="14" x2="16.01" y2="14"/>
              </svg>
            </div>
            <p class="empty-title">Tudo vazio por aqui</p>
            <p class="empty-sub">Adicione tarefas usando o campo abaixo, cole texto ou importe um JSON.</p>
          </li>`;
        return;
      }

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item${task.done ? ' done' : ''}`;
        li.setAttribute('role', 'checkbox');
        li.setAttribute('aria-checked', task.done);
        li.setAttribute('tabindex', '0');
        li.style.animationDelay = `${index * 0.03}s`;

        li.innerHTML = `
          <div class="cb" aria-hidden="true">
            <svg class="cb-check" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
          </div>
          <span class="task-text">${escHtml(task.text)}</span>
          <button class="task-delete" aria-label="Remover tarefa" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>`;

        const toggle = () => {
          tasks[index].done = !tasks[index].done;
          textInput.value = tasksToText(tasks);
          save(); render();
        };

        li.addEventListener('click', e => {
          if (e.target.closest('.task-delete')) return;
          toggle();
        });

        li.addEventListener('keydown', e => {
          if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); }
        });

        li.querySelector('.task-delete').addEventListener('click', e => {
          e.stopPropagation();
          tasks.splice(index, 1);
          textInput.value = tasksToText(tasks);
          save(); render();
        });

        taskList.appendChild(li);
      });
    }

    const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    function setTasks(newTasks, syncText = true) {
      tasks = newTasks;
      if (syncText) textInput.value = tasksToText(tasks);
      save(); render();
    }

    /* ─── Quick add ─── */
    function addQuick() {
      const text = quickInput.value.trim();
      if (!text) return;
      tasks.push({ id: crypto.randomUUID(), text, done: false });
      quickInput.value = '';
      textInput.value  = tasksToText(tasks);
      save(); render();
    }

    btnAdd.addEventListener('click', addQuick);
    quickInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addQuick(); } });

    /* ─── Clear ─── */
    btnClear.addEventListener('click', () => {
      if (!tasks.length) return;
      if (confirm('Remover todas as tarefas?')) { tasks = []; textInput.value = ''; save(); render(); }
    });

    /* ─── Text input ─── */
    textInput.addEventListener('input', () => {
      clearError();
      setTasks(parseText(textInput.value), false);
    });

    /* ─── JSON import ─── */
    async function handleFile(file) {
      if (!file) return;
      clearError();
      try {
        const content = await file.text();
        const data = JSON.parse(content);
        setTasks(extractFromJson(data), true);
      } catch (err) {
        showError(err.message || 'Não consegui ler esse JSON.');
      }
    }

    jsonInput.addEventListener('change', e => {
      handleFile(e.target.files?.[0]);
      jsonInput.value = '';
    });

    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('drag');
      handleFile(e.dataTransfer.files?.[0]);
    });

    /* ─── Load ─── */
    function loadSaved() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        if (Array.isArray(saved)) {
          tasks = saved.map(normalizeTask).filter(t => t.text.length > 0);
          textInput.value = tasksToText(tasks);
        }
      } catch (_) { tasks = []; }
      render();
    }

    loadSaved();
  </script>
</body>
</html>
